[project]
name = "polaris"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.15.0",
    "celery[redis]~=5.6",
    "django~=6.1",
    "django-environ>=0.14.0",
    "django-htmx>=1.29.0",
    "gunicorn>=26.2.0",
    "openpyxl>=3.1.5",
    "pillow>=13.0.0",
    "psycopg[binary]~=3.3",
    "pydantic>=2.14.1",
    "python-docx>=1.2.0",
    "weasyprint>=70.0",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "django-debug-toolbar>=8.0.0",
    "factory-boy>=3.3.3",
    "faker>=40.43.0",
    "hypothesis>=6.170.2",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "pytest-playwright>=0.10.0",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106"]  # assert and hard-coded test passwords are fine in tests

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
filterwarnings = [
    # WhiteNoise looks for collected static files, which tests never build
    "ignore:No directory at:UserWarning",
]

[tool.coverage.run]
source = ["apps"]
branch = true
omit = ["*/migrations/*", "*/tests/*"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
